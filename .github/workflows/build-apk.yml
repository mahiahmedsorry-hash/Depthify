name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Extract ZIP and find project root
        id: extract
        run: |
          # ১. রুট ডিরেক্টরিতে জিপ ফাইল খোঁজা
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in the root directory of the repository."
            exit 1
          fi
          echo "✅ Found ZIP: $ZIP_FILE"
          
          # ২. জিপ এক্সট্রাক্ট করা
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          echo "✅ ZIP extracted successfully."
          
          # ৩. settings.gradle.kts ফাইলটি খুঁজে বের করা (এক্সট্রা প্যারেন্ট ফোল্ডার থাকলেও এটি ধরে ফেলবে)
          SETTINGS_FILE=$(find extracted_project -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle.kts inside the ZIP. Please check your project structure."
            exit 1
          fi
          
          # ৪. প্রজেক্টের মূল ডিরেক্টরি সেট করা
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✅ Project root found at: $PROJECT_DIR"
          
          # ৫. পরবর্তী স্টেপের জন্য পাথটি সেভ করে রাখা
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          echo "🚀 Starting Gradle Build in ${{ env.PROJECT_DIR }}..."
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: depthify-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
